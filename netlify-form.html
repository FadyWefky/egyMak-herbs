<!-- 
  Netlify Forms Integration
  Add this hidden form to your index.html for Netlify Forms to work
  This allows direct email sending without any JavaScript
-->
<form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" style="display: none;">
  <input type="hidden" name="form-name" value="contact" />
  <p>
    <label>Your Name: <input type="text" name="name" /></label>
  </p>
  <p>
    <label>Your Email: <input type="email" name="email" /></label>
  </p>
  <p>
    <label>Message: <textarea name="message"></textarea></label>
  </p>
  <p>
    <button type="submit">Send</button>
  </p>
</form>
